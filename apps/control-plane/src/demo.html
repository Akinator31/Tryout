<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Portfolio (demo)</title>
<style>body{font:15px system-ui;margin:24px;background:#fafafa} .p{margin:24px 0} iframe{width:100%;height:560px;border:1px solid #ccc;border-radius:8px;background:#111}</style>
</head>
<body>
<h1>Simulated portfolio</h1>
<p>Each block is an iframe pointing at <code>/embed/&lt;project&gt;</code>, as a real portfolio would embed it.</p>
<div id="list"></div>
<script>
const FRAME_ALLOW = "clipboard-read; clipboard-write; autoplay; fullscreen; keyboard-map";

/** A block with a "Try it" button that turns into the project's embed iframe. */
function projectBlock({ name, title }) {
  const block = document.createElement("div");
  const heading = document.createElement("h2");
  const button = document.createElement("button");

  block.className = "p";
  heading.textContent = title;
  button.textContent = "Try it";
  block.append(heading, button);

  button.onclick = () => {
    const frame = document.createElement("iframe");
    frame.src = `/embed/${encodeURIComponent(name)}`;
    frame.allow = FRAME_ALLOW;
    button.replaceWith(frame);
  };
  return block;
}

for (const project of __PROJECTS__) {
  document.getElementById("list").appendChild(projectBlock(project));
}
</script>
</body>
</html>
