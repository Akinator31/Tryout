<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tryout</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 15px/1.5 system-ui, sans-serif; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
  #bar { position: absolute; top: 0; right: 0; padding: 2px 8px; font-size: 12px; background: #000a; z-index: 2; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  button { font: inherit; padding: 6px 14px; margin-top: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="status">Connecting…</div>
<div id="bar" hidden></div>
<script>
const project = "__PROJECT__";
const FRAME_ALLOW = "clipboard-read; clipboard-write; autoplay; fullscreen; keyboard-map";
const statusEl = document.getElementById("status");
const bar = document.getElementById("bar");

let ticket = null;
let frame = null;
let events = null;
let retry = null;
let countdown = null;
let endsAt = 0;

/** Shows a message (HTML) over the page. */
function show(html) {
  statusEl.innerHTML = html;
  statusEl.hidden = false;
}

/** Takes a ticket for the project, then follows it. */
async function join() {
  clearTimeout(retry);
  show("Connecting…");

  const r = await fetch(`/api/projects/${project}/tickets`, { method: "POST" });
  if (r.status === 429) return limited(Number(r.headers.get("retry-after")) || 30);
  if (!r.ok) return show("Project unavailable.");

  ticket = (await r.json()).ticket;
  listen();
}

/** Per-IP limit reached (ADR 0016): counts down, then tries again on its own. */
function limited(seconds) {
  let left = seconds;

  const tick = () => {
    if (left <= 0) return join();
    show(`Too many sessions from your network.<br><small>Trying again in ${left} s.</small>`);
    left--;
    retry = setTimeout(tick, 1000);
  };
  tick();
}

/**
 * Follows the ticket over server-sent events: the server pushes every change
 * and a fresh view every 10 s. The open stream is also the heartbeat (ADR 0012).
 */
function listen() {
  clearTimeout(retry);
  events = new EventSource(`/api/tickets/${ticket}/events`);
  events.addEventListener("ticket", (e) => render(JSON.parse(e.data)));
  events.onerror = onStreamError;
}

/**
 * The browser reconnects a dropped stream by itself. A closed one was refused
 * (unknown ticket, too many streams from this IP) or ended: checks by polling,
 * which also keeps the ticket alive, then listens again unless the ticket
 * ended or was replaced meanwhile.
 */
async function onStreamError() {
  if (events.readyState !== EventSource.CLOSED) return;

  const current = ticket;
  try {
    const r = await fetch(`/api/tickets/${current}`);
    if (current !== ticket) return;
    if (r.status === 404) return ended("Session expired.");

    const v = await r.json();
    render(v);
    if (v.state === "ended") return;
  } catch {}

  if (current === ticket) retry = setTimeout(listen, 3000);
}

/** Shows a ticket's view, pushed or polled, whatever its state. */
function render(v) {
  if (v.state === "waiting") {
    show(`Queue position: <b>${v.position}</b><br><small>Your session will start automatically.</small>`);
  }
  if (v.state === "starting") show("Starting the environment…");
  if (v.state === "active") renderActive(v);
  if (v.state === "ended") ended(v.error || "Session ended.");
}

/** Opens the session frame once, and re-syncs the countdown with every message. */
function renderActive(v) {
  if (!frame) {
    frame = document.createElement("iframe");
    frame.allow = FRAME_ALLOW;
    frame.src = v.url;
    document.body.appendChild(frame);
    statusEl.hidden = true;
  }

  endsAt = Date.now() + v.ends_in_s * 1000;
  if (!countdown) countdown = setInterval(tickDown, 1000);
  tickDown();
  bar.hidden = false;
}

/** Updates the remaining time shown under the session. */
function tickDown() {
  const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
  const seconds = String(left % 60).padStart(2, "0");
  bar.textContent = `ends in ${Math.floor(left / 60)}:${seconds}`;
}

/** Tears the session down and offers to start again. */
function ended(msg) {
  if (events) {
    events.close();
    events = null;
  }
  clearTimeout(retry);
  clearInterval(countdown);
  countdown = null;
  if (frame) {
    frame.remove();
    frame = null;
  }
  bar.hidden = true;
  ticket = null;

  show(`${msg}<br><button onclick="join()">Start again</button>`);
}

addEventListener("pagehide", () => {
  if (ticket) navigator.sendBeacon(`/api/tickets/${ticket}/release`);
});

join();
</script>
</body>
</html>
