<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tryout</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 15px/1.5 system-ui, sans-serif; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; }
  #bar { position: absolute; top: 0; right: 0; padding: 2px 8px; font-size: 12px; background: #000a; z-index: 2; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  button { font: inherit; padding: 6px 14px; margin-top: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="status">Connecting…</div>
<div id="bar" hidden></div>
<script>
const project = "__PROJECT__";
const statusEl = document.getElementById("status");
const bar = document.getElementById("bar");
let ticket = null, frame = null, events = null, retry = null, countdown = null, endsAt = 0;

function show(html) { statusEl.innerHTML = html; statusEl.hidden = false; }

async function join() {
  show("Connecting…");
  const r = await fetch(`/api/projects/${project}/tickets`, { method: "POST" });
  if (!r.ok) return show("Project unavailable.");
  ticket = (await r.json()).ticket;
  listen();
}

// Server-sent events: the server pushes every change and a fresh view every
// 10 s. The open stream is also the heartbeat (ADR 0012).
function listen() {
  clearTimeout(retry);
  events = new EventSource(`/api/tickets/${ticket}/events`);
  events.addEventListener("ticket", (e) => render(JSON.parse(e.data)));
  events.onerror = async () => {
    if (events.readyState !== EventSource.CLOSED) return; // the browser reconnects by itself
    // Refused (unknown ticket) or closed after the end: check, then retry.
    const current = ticket;
    try {
      const r = await fetch(`/api/tickets/${current}`);
      if (current !== ticket) return;
      if (r.status === 404) return ended("Session expired.");
      const v = await r.json();
      render(v);
      if (v.state === "ended") return;
    } catch {}
    if (current === ticket) retry = setTimeout(listen, 3000);
  };
}

function render(v) {
  if (v.state === "waiting") show(`Queue position: <b>${v.position}</b><br><small>Your session will start automatically.</small>`);
  if (v.state === "starting") show("Starting the environment…");
  if (v.state === "active") {
    if (!frame) {
      frame = document.createElement("iframe");
      frame.allow = "clipboard-read; clipboard-write; autoplay; fullscreen; keyboard-map";
      frame.src = v.url;
      document.body.appendChild(frame);
      statusEl.hidden = true;
    }
    endsAt = Date.now() + v.ends_in_s * 1000; // re-synced by every message
    if (!countdown) countdown = setInterval(tickDown, 1000);
    tickDown();
    bar.hidden = false;
  }
  if (v.state === "ended") ended(v.error || "Session ended.");
}

function tickDown() {
  const left = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
  bar.textContent = `ends in ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
}

function ended(msg) {
  if (events) { events.close(); events = null; }
  clearTimeout(retry);
  clearInterval(countdown); countdown = null;
  if (frame) { frame.remove(); frame = null; }
  bar.hidden = true;
  ticket = null;
  show(`${msg}<br><button onclick="join()">Start again</button>`);
}

addEventListener("pagehide", () => { if (ticket) navigator.sendBeacon(`/api/tickets/${ticket}/release`); });
join();
</script>
</body>
</html>
