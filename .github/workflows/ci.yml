name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/node/go.mod
          cache-dependency-path: apps/node/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  control-plane:
    name: Control plane (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tryout
          POSTGRES_PASSWORD: tryout
          POSTGRES_DB: tryout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tryout" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (PGlite)
        run: npm test
      - name: Tests (PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://tryout:tryout@localhost:5432/tryout

  embed:
    name: Embed page (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/embed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/embed/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Size budget
        run: npm run size

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh examples/*/*.sh
      - name: Schema copies in sync
        run: scripts/sync-schema.sh --check

  images:
    # Pull requests: build only, with a read-only token.
    name: Image ${{ matrix.name }} (amd64 + arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tryout-node
            context: apps/node
            description: Tryout node, agent and gateway binaries in one image
          - name: tryout-control-plane
            context: .
            file: apps/control-plane/Dockerfile
            description: Tryout control plane, queue and embed page
          - name: tryout-example-cli-hello
            context: examples/cli-hello
            description: Sample Tryout terminal project (ttyd)
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  publish:
    # main and v* tags: build and push to ghcr.io, only after every test passed.
    # See docs/published-images.md.
    name: Publish ${{ matrix.name }} (amd64 + arm64)
    if: github.event_name == 'push'
    needs: [node, control-plane, embed, shellcheck, e2e, e2e-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tryout-node
            context: apps/node
            description: Tryout node, agent and gateway binaries in one image
          - name: tryout-control-plane
            context: .
            file: apps/control-plane/Dockerfile
            description: Tryout control plane, queue and embed page
          - name: tryout-example-cli-hello
            context: examples/cli-hello
            description: Sample Tryout terminal project (ttyd)
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        # The namespace follows the repository owner, so a fork publishes to its own.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
      - name: Version reported by the binaries
        id: version
        # The release on v* tags, else the commit: every main build is tagged edge.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: GitHub build attestation
        # Artifact attestations need a public repository on GitHub's free plans.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  e2e:
    name: End-to-end (dev profile)
    runs-on: ubuntu-latest
    needs: [node, control-plane]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the example project image
        run: docker build -t tryout-example/cli-hello:dev examples/cli-hello
      - name: Example image meets the project contract
        run: scripts/check-image.sh tryout-example/cli-hello:dev
      - name: Start the stack
        run: |
          cp deploy/.env.example deploy/.env
          echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> deploy/.env
          docker compose -f deploy/compose.dev.yaml up -d --build
          for _ in $(seq 60); do
            curl -fs localhost:3000/healthz >/dev/null && curl -fs localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Terminal session through the gateway
        run: node scripts/e2e-cli.ts
      - name: Queue, promotion and heartbeat loss
        run: node scripts/e2e-queue.ts
      - name: SSE stream, push and heartbeat
        run: node scripts/e2e-sse.ts
      - name: Mutual TLS on the agent API
        run: node scripts/e2e-mtls.ts
      - name: Per-IP limits
        run: node scripts/e2e-limits.ts
      - name: Session survives a recreated gateway
        run: >-
          node scripts/e2e-reattach.ts http://localhost:3000 cli-hello --
          docker compose -f deploy/compose.dev.yaml up -d --force-recreate --no-deps gateway
      - name: Logs
        if: always()
        run: docker compose -f deploy/compose.dev.yaml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.dev.yaml down -v

  e2e-deploy:
    # The production layout of docs/deployment.md: deploy/node and deploy/control-plane
    # as two compose projects, profile strict with gVisor, certificates from tryout-certs.
    name: End-to-end (production layout, strict + gVisor)
    runs-on: ubuntu-latest
    needs: [node, control-plane]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install gVisor
        run: |
          # Pinned release; runsc needs its gvisor-bin/ helpers next to it.
          url=https://storage.googleapis.com/gvisor/releases/release/20261109.0/$(uname -m)
          curl -fsSLO "$url/gvisor.tar.bz2" -O "$url/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin --no-same-owner
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Deploy and test
        run: scripts/e2e-deploy.sh
