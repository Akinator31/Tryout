name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be publishing images.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Node (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/node/go.mod
          cache-dependency-path: apps/node/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  control-plane:
    name: Control plane (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tryout
          POSTGRES_PASSWORD: tryout
          POSTGRES_DB: tryout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tryout" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: apps/control-plane
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/control-plane/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (PGlite)
        run: npm test
      - name: Tests (PostgreSQL)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://tryout:tryout@localhost:5432/tryout

  embed:
    name: Embed page (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/embed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/embed/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Size budget
        run: npm run size

  admin:
    name: Admin UI (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Size budget
        run: npm run size

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck scripts/*.sh scripts/e2e/*.sh examples/*/*.sh
      - name: Schema copies in sync
        run: scripts/sync-schema.sh --check

  images:
    # Pull requests: build only, with a read-only token.
    name: Image ${{ matrix.name }} (amd64 + arm64)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tryout-node
            context: apps/node
            description: Tryout node, agent and gateway binaries in one image
          - name: tryout-ttyd
            context: apps/node/ttyd
            description: The web terminal the Tryout agent mounts into terminal sessions
          - name: tryout-control-plane
            context: .
            file: apps/control-plane/Dockerfile
            description: Tryout control plane, queue, embed page and admin UI
          - name: tryout-example-cli-hello
            context: examples/cli-hello
            description: Sample Tryout terminal project
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}

  publish-ttyd:
    # Published first: tryout-node embeds its digest as the agent's default TTYD_IMAGE,
    # so each release pins the ttyd its terminals run.
    name: Publish tryout-ttyd (amd64 + arm64)
    if: github.event_name == 'push'
    needs: [node, control-plane, embed, admin, shellcheck, e2e, e2e-deploy, e2e-single-host]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tryout-ttyd" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=tryout-ttyd
            org.opencontainers.image.description=The web terminal the Tryout agent mounts into terminal sessions
          annotations: |
            org.opencontainers.image.description=The web terminal the Tryout agent mounts into terminal sessions
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: apps/node/ttyd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=tryout-ttyd
          cache-to: type=gha,mode=max,scope=tryout-ttyd
      - name: GitHub build attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    # main and v* tags: build and push to ghcr.io, only after every test passed.
    # See docs/published-images.md.
    name: Publish ${{ matrix.name }} (amd64 + arm64)
    if: github.event_name == 'push'
    needs: [node, control-plane, embed, admin, shellcheck, e2e, e2e-deploy, e2e-single-host, publish-ttyd]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tryout-node
            context: apps/node
            description: Tryout node, agent and gateway binaries in one image
          - name: tryout-control-plane
            context: .
            file: apps/control-plane/Dockerfile
            description: Tryout control plane, queue, embed page and admin UI
          - name: tryout-example-cli-hello
            context: examples/cli-hello
            description: Sample Tryout terminal project
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        id: name
        # The namespace follows the repository owner, so a fork publishes to its own.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=edge,branch=main
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
      - name: Version reported by the binaries
        id: version
        # The release on v* tags, else the commit: every main build is tagged edge.
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            TTYD_IMAGE=${{ needs.publish-ttyd.outputs.image }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: GitHub build attestation
        # Artifact attestations need a public repository on GitHub's free plans.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  e2e:
    name: End-to-end (dev profile)
    runs-on: ubuntu-latest
    needs: [node, control-plane]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build the example project image and the ttyd image
        run: |
          docker build -t tryout-example/cli-hello:dev examples/cli-hello
          docker build -t tryout/ttyd:dev apps/node/ttyd
      - name: Example image meets the project contract
        run: scripts/check-image.sh --ttyd-image tryout/ttyd:dev tryout-example/cli-hello:dev
      - name: Start the stack
        run: |
          cp deploy/.env.example deploy/.env
          echo "DOCKER_GID=$(stat -c %g /var/run/docker.sock)" >> deploy/.env
          docker compose -f deploy/compose.dev.yaml up -d --build
          for _ in $(seq 60); do
            curl -fs localhost:3000/healthz >/dev/null && curl -fs localhost:8080/healthz >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Terminal session through the gateway
        run: node scripts/e2e/cli.ts
      - name: Node health and metrics on the admin listener
        run: node scripts/e2e/metrics.ts
      - name: Admin accounts, login and logout
        run: node scripts/e2e/admin.ts
      - name: Queue, promotion and heartbeat loss
        run: node scripts/e2e/queue.ts
      - name: SSE stream, push and heartbeat
        run: node scripts/e2e/sse.ts
      - name: Mutual TLS on the agent API
        run: node scripts/e2e/mtls.ts
      - name: Per-IP limits
        run: node scripts/e2e/limits.ts
      - name: Session survives a recreated gateway
        run: >-
          node scripts/e2e/reattach.ts http://localhost:3000 cli-hello --
          docker compose -f deploy/compose.dev.yaml up -d --force-recreate --no-deps gateway
      - name: Logs
        if: always()
        run: docker compose -f deploy/compose.dev.yaml logs --no-color
      - name: Stop
        if: always()
        run: docker compose -f deploy/compose.dev.yaml down -v

  e2e-deploy:
    # The production layout of docs/deployment.md: deploy/node and deploy/control-plane
    # as two compose projects, profile strict with gVisor, certificates from tryout-certs.
    name: End-to-end (production layout, strict + gVisor)
    runs-on: ubuntu-latest
    needs: [node, control-plane]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install gVisor
        run: |
          # Pinned release; runsc needs its gvisor-bin/ helpers next to it.
          url=https://storage.googleapis.com/gvisor/releases/release/20261109.0/$(uname -m)
          curl -fsSLO "$url/gvisor.tar.bz2" -O "$url/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin --no-same-owner
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Deploy and test
        run: scripts/e2e/deploy.sh

  e2e-single-host:
    # docs/single-host.md on a fresh runner: a dedicated user's rootless daemon next to the
    # root one, its cgroup controllers delegated, the egress filter loaded, then the
    # production layout with the node on that daemon (profile single-host, runc).
    name: End-to-end (production layout, single-host + rootless)
    runs-on: ubuntu-latest
    needs: [node, control-plane]
    env:
      NODE_USER: tryout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the rootless extras
        run: |
          # The runner's Docker comes from Docker's repository, whose source the image drops:
          # add it back and take the extras of the installed version.
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-ci.gpg
          echo "deb [signed-by=/usr/share/keyrings/docker-ci.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
            | sudo tee /etc/apt/sources.list.d/docker-ci.list >/dev/null
          sudo apt-get update -q
          version=$(dpkg-query -W -f '${Version}' docker-ce)
          sudo apt-get install -y -q "docker-ce-rootless-extras=$version" uidmap slirp4netns dbus-user-session
      - name: Create the user, delegate its cgroup controllers, enable lingering
        run: |
          sudo adduser --disabled-password --comment "" "$NODE_USER"
          grep "^$NODE_USER:" /etc/subuid /etc/subgid
          uid=$(id -u "$NODE_USER")
          echo "NODE_UID=$uid" >>"$GITHUB_ENV"
          sudo install -D -m 644 deploy/node/single-host/delegate.conf \
            "/etc/systemd/system/user@$uid.service.d/delegate.conf"
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$NODE_USER"
          timeout 30 sh -c "until systemctl is-active -q user@$uid.service; do sleep 1; done"
          ls -la "/run/user/$uid"
      - name: Install the rootless daemon
        run: |
          sudo -u "$NODE_USER" -H env XDG_RUNTIME_DIR="/run/user/$NODE_UID" \
            dockerd-rootless-setuptool.sh install
          sudo -u "$NODE_USER" -H docker --context rootless info | tee info.txt
          grep -q "name=rootless" info.txt
      - name: Load the egress filter
        run: |
          IFS=: read -r _ start count < <(grep "^$NODE_USER:" /etc/subuid)
          sudo install -d /etc/tryout
          sed "s|^define tryout_uids = .*|define tryout_uids = { $NODE_UID, $start-$((start + count - 1)) }|" \
            deploy/node/single-host/tryout-egress.nft | sudo tee /etc/tryout/tryout-egress.nft >/dev/null
          sudo install -m 644 deploy/node/single-host/tryout-egress.service /etc/systemd/system/
          sudo systemctl enable --now tryout-egress.service
          sudo nft list table inet tryout_egress
      - name: Check the egress filter
        run: |
          addr=$(hostname -I | awk '{print $1}')
          python3 -m http.server 8999 --bind "$addr" >/dev/null 2>&1 &
          server=$!
          timeout 30 sh -c "until curl -fs http://$addr:8999/ >/dev/null; do sleep 1; done"
          # The user and its subordinate uids reach neither the host nor private ranges...
          if sudo -u "$NODE_USER" curl -fsS -m 5 "http://$addr:8999/"; then exit 1; fi
          IFS=: read -r _ start _ < <(grep "^$NODE_USER:" /etc/subuid)
          if sudo setpriv --reuid="$((start + 1000))" --regid="$((start + 1000))" --clear-groups \
            curl -fsS -m 5 "http://$addr:8999/"; then exit 1; fi
          # ...but resolve names and reach the Internet.
          sudo -u "$NODE_USER" curl -fsS -m 10 -o /dev/null https://ghcr.io/
          kill "$server"
      - name: Deploy and test
        run: scripts/e2e/deploy.sh
