# Delegates the cgroup controllers the agent needs to the dedicated user's systemd manager, so
# that its rootless daemon can apply the sessions' memory, CPU and pids limits
# (docs/single-host.md). Install it as /etc/systemd/system/user@<uid>.service.d/delegate.conf,
# where <uid> is the user's uid (id -u tryout).
[Service]
Delegate=cpu cpuset io memory pids
