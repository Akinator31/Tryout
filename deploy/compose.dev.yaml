# Local, single-machine stack (profile dev). NOT a production layout:
# in production the agent+gateway run on the sandbox node and the control
# plane elsewhere (e.g. Dokploy). Run from the repo root: docker compose -f deploy/compose.dev.yaml up --build
name: tryout-dev

services:
  # One-shot: the private PKI of the control plane -> agent mutual TLS
  # (docs/certificates.md). Created once in the pki volume, kept across restarts.
  # Each service below mounts only its own sub-directory of that volume.
  pki-ca:
    build: ../apps/node
    command: ["tryout-certs", "init", "--dir", "/pki", "--if-missing", "--owner", "1000:1000"]  # the control plane runs as node (1000)
    user: "0"
    volumes: [pki:/pki]
    network_mode: none

  pki-node:
    build: ../apps/node
    command: ["tryout-certs", "node", "local", "--san", "agent", "--san", "localhost", "--san", "127.0.0.1",
              "--dir", "/pki", "--if-missing", "--owner", "${AGENT_USER:-0}:0"]
    user: "0"
    volumes: [pki:/pki]
    network_mode: none
    depends_on:
      pki-ca: { condition: service_completed_successfully }

  # One-shot: builds the ttyd image the agent mounts into terminal sessions
  # (TTYD_IMAGE below) and checks that its binary runs.
  ttyd:
    build: ../apps/node/ttyd
    image: tryout/ttyd:dev
    entrypoint: ["/ttyd", "--version"]
    network_mode: none

  agent:
    build: ../apps/node
    command: ["tryout-agent"]
    environment:
      TTYD_IMAGE: ${TTYD_IMAGE:-tryout/ttyd:dev}
      DOCKER_HOST: unix:///var/run/docker.sock
      NODE_PROFILE: ${NODE_PROFILE:-dev}
      DEFAULT_RUNTIME: ${DEFAULT_RUNTIME:-runsc}
      ALLOW_RUNC: ${ALLOW_RUNC:-false}
      AGENT_TLS_CERT: /pki/tls.crt
      AGENT_TLS_KEY: /pki/tls.key
      AGENT_TLS_CLIENT_CA: /pki/ca.crt
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set in .env}
      GATEWAY_CONTAINER: tryout-gateway
      GATEWAY_ADMIN_SOCKET: unix:///run/tryout/gateway.sock
      MAX_SESSIONS: "6"
    volumes:
      # dev only. single-host: mount the ROOTLESS daemon socket instead.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - gateway-admin:/run/tryout
      - { type: volume, source: pki, target: /pki, read_only: true, volume: { subpath: nodes/local } }
    # Published on the loopback only, for scripts/e2e/mtls.ts. A real node exposes
    # the API on a private network or a tunnel towards the control plane.
    ports: ["127.0.0.1:7000:7000"]
    depends_on:
      pki-node: { condition: service_completed_successfully }
      ttyd: { condition: service_completed_successfully }
    # Socket access: Docker Desktop exposes it root:root, a native daemon uses the
    # docker group. dev only; a real node runs the agent as the rootless user.
    user: "${AGENT_USER:-0}"
    group_add: ["${DOCKER_GID:-0}"]
    networks: [control]
    restart: unless-stopped

  gateway:
    build: ../apps/node
    container_name: tryout-gateway   # the agent attaches this container to session networks
    command: ["tryout-gateway"]
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set in .env}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS:-http://localhost:3000 http://localhost:9090}
      ADMIN_SOCKET: unix:///run/tryout/gateway.sock
    volumes:
      - gateway-admin:/run/tryout   # admin API: shared with the agent only
    ports: ["8080:8080"]           # expose however you like: tunnel, Traefik, Caddy...
    networks: [control]
    restart: unless-stopped

  control-plane:
    build: { context: .., dockerfile: apps/control-plane/Dockerfile }
    environment:
      TRYOUT_CONFIG: /app/tryout.yaml
      DATABASE_URL: postgres://tryout:tryout@postgres:5432/tryout
      ADMIN_METRICS_TOKEN: dev-metrics-token-0123456789abcdef   # dev only; scripts/e2e/metrics.ts sends it
    volumes:
      - ./tryout.dev.yaml:/app/tryout.yaml:ro
      - { type: volume, source: pki, target: /app/pki, read_only: true, volume: { subpath: control-plane } }
    ports: ["3000:3000", "127.0.0.1:9090:9090"]
    networks: [control, db]
    depends_on:
      postgres: { condition: service_healthy }
      pki-ca: { condition: service_completed_successfully }
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tryout
      POSTGRES_PASSWORD: tryout   # dev only
      POSTGRES_DB: tryout
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tryout"]
      interval: 2s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [db]   # only the control plane: nodes must never reach the state store
    restart: unless-stopped

networks:
  control: {}
  db:
    internal: true

volumes:
  gateway-admin: {}
  pki: {}
  postgres: {}
