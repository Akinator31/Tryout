# yaml-language-server: $schema=https://akinator31.github.io/Tryout/schema/v1/tryout.schema.json
# Control plane configuration: an example to adapt. Reference: docs/configuration.md.
# Guide: docs/deployment.md. ${NAME} reads an environment variable of the container.
# The settings (embed_frame_ancestors, theme, limits, nodes, projects) seed the database
# on the first start; afterwards, change them with the import command, and remove them
# from this file or keep them in step (docs/configuration.md#settings-and-revisions).
listen: ":3000"

# Optional: the admin listener: the admin API (accounts made with the create-user command)
# and Prometheus metrics on /metrics. Off when left out. Keep it off the Internet: publish it
# on a private address only (see compose.yaml), and reach it over HTTPS or an SSH tunnel, or
# put it behind an identity-aware proxy (docs/deployment.md).
# admin_listen: ":9090"
# Bearer token Prometheus sends to read /metrics; put the value in .env.
# admin_metrics_token: "${ADMIN_METRICS_TOKEN}"
# Where visitors reach this control plane, origin only. The admin shows it in the address to
# embed and runs the project preview from it; add the admin's origin to embed_frame_ancestors
# for the preview, or turn it off with admin_preview: false.
# public_url: https://tryout.example.org

# The portfolios allowed to embed /embed/<project> in an iframe.
embed_frame_ancestors:
  - https://portfolio.example.org

# Optional: the look of the embed page. The accent needs a contrast of at least 3:1
# on the dark card; the logo (SVG, PNG or WebP, at most 64 KB) is relative to this
# file, so mount it next to it.
# theme:
#   accent: "#ffb000"
#   logo: { file: logo.svg, alt: Your name }

# Your reverse proxy or tunnel, as the control plane sees it. Only these peers may
# set X-Forwarded-For (or the header below). The block below covers a proxy on the
# host that connects to the published port; narrow it to your proxy's address, since
# every container on this machine could otherwise forge the header. See docs/exposure.md.
client_ip:
  trusted_proxies: [172.16.0.0/12]
  # header: CF-Connecting-IP

# Mutual TLS towards the agents, relative to this file (compose.yaml mounts ./pki).
agent_tls:
  ca: pki/ca.crt
  cert: pki/tls.crt
  key: pki/tls.key

nodes:
  cli:
    # The agent's private API; its certificate must name this host (or server_name).
    agent_url: https://10.0.50.10:7000
    # What the browser loads: the node's gateway behind your proxy, on a domain
    # dedicated to sessions.
    public_url: https://sbx.example.dev/s/{session}/
    # Optional: the same gateway as the control plane reaches it, to check that a
    # session answers before handing out its URL. Defaults to public_url.
    # probe_url: http://10.0.50.10:8080/s/{session}/
    max_sessions: 10

projects:
  cli-hello:
    title: Hello CLI   # shown to visitors; defaults to the key above
    node: cli
    # Pin by digest in production: ghcr.io/<owner>/<image>:<tag>@sha256:...
    image: ghcr.io/akinator31/tryout-example-cli-hello:0.2.0
    kind: terminal
    max_sessions: 2
    max_age: 10m
